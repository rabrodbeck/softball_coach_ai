name: Deploy Backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy_hf.yml'
  workflow_dispatch:

jobs:
  test:
    name: Backend Validation & Import Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Syntax & Import Gate
        env:
          OPENAI_API_KEY: "dummy-key-for-ci-import-gate"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: |
          cd backend
          python -c "import src.main, src.retriever, src.ingest, src.auth, src.db.coaches, src.db.players, src.db.teams, src.db.pool; print('All backend modules validated and imported cleanly!')"

  deploy:
    name: Deploy to Hugging Face
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy backend subtree to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Extract backend directory into a temporary branch
          git subtree split --prefix backend -b hf-deploy
          
          # Force push the backend subtree directly to Hugging Face Space main branch
          git push --force https://rbrodbeck:${HF_TOKEN}@huggingface.co/spaces/rbrodbeck/softball-coach-ai hf-deploy:main
